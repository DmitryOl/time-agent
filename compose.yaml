name: time-agent

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - agent_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  agent_data: